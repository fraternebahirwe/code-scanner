<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Code Scanner</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
      --text: #e8eaf0; --muted: #8b93a3; --brand: #5b7cff; --brand-2: #3b57e0;
      --brand-ink: #ffffff; --danger: #ff6b6b; --ok: #35c07a; --radius: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8; --panel: #ffffff; --panel-2: #eef1f5; --line: #e2e6ec;
        --text: #14181f; --muted: #5b6472; --brand: #3b57e0; --brand-2: #2a44ac;
        --danger: #d33a4b; --ok: #1f9d55;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100%;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    [hidden] { display: none !important; }

    header {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
      background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
      animation: drop-in .45s ease-out both;
    }
    @keyframes drop-in { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--brand), #9d7bff); color: #fff; flex: none;
    }
    .logo svg { width: 19px; height: 19px; }
    header h1 { margin: 0; font-size: 17px; flex: 1; font-weight: 650; }

    /* Icon buttons in the header */
    .icon-btn {
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
      width: 38px; height: 38px; display: grid; place-items: center; color: var(--text);
      transition: transform .18s ease-out, background-color .18s ease-out, border-color .18s ease-out, box-shadow .18s ease-out, opacity .18s;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--brand); box-shadow: 0 4px 12px rgb(0 0 0 / .18); }
    .icon-btn:active:not(:disabled) { transform: translateY(0) scale(.94); }
    .icon-btn:disabled { opacity: .4; cursor: default; }
    .icon-btn.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 18px; gap: 16px; }
    .stage { animation: rise-in .5s ease-out both; animation-delay: .08s; }
    .controls { animation: rise-in .5s ease-out both; animation-delay: .16s; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* Camera stage */
    .stage {
      position: relative; width: 100%; max-width: 520px; aspect-ratio: 3 / 4;
      background: #000; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--line); box-shadow: 0 10px 30px rgb(0 0 0 / .25);
    }
    @media (min-width: 640px) { .stage { aspect-ratio: 4 / 3; } }
    /* Flip the stage when the user switches cameras. */
    .stage.flipping { animation: flip .5s ease; }
    @keyframes flip {
      0% { transform: perspective(900px) rotateY(0); }
      50% { transform: perspective(900px) rotateY(90deg); }
      50.01% { transform: perspective(900px) rotateY(-90deg); }
      100% { transform: perspective(900px) rotateY(0); }
    }
    video {
      width: 100%; height: 100%; object-fit: cover; display: block; background: #000;
      opacity: 0; transform: scale(1.04);
      transition: opacity .5s ease-out, transform .6s cubic-bezier(.2, .8, .2, 1);
    }
    .stage.live video { opacity: 1; transform: scale(1); }
    /* Mirror the front / built-in webcam so it feels like a mirror; the back
       camera is left as-is so the world reads the right way round. */
    .stage.mirror video { transform: scaleX(-1) scale(1.04); }
    .stage.mirror.live video { transform: scaleX(-1) scale(1); }

    /* Scan reticle overlay */
    .reticle { position: absolute; inset: 0; pointer-events: none; }
    .reticle .mask {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, transparent 0, transparent 38%, rgb(0 0 0 / .45) 72%);
    }
    .frame {
      position: absolute; left: 50%; top: 50%; width: min(62%, 260px); aspect-ratio: 1;
      transform: translate(-50%, -50%);
    }
    .corner {
      position: absolute; width: 30px; height: 30px; border: 3px solid var(--brand); border-radius: 4px;
      opacity: 0; animation: corner-in .4s ease-out forwards;
    }
    .corner.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; transform: translate(6px, 6px); animation-delay: .05s; }
    .corner.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; transform: translate(-6px, 6px); animation-delay: .12s; }
    .corner.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; transform: translate(6px, -6px); animation-delay: .19s; }
    .corner.br { bottom: 0; right: 0; border-left: 0; border-top: 0; transform: translate(-6px, -6px); animation-delay: .26s; }
    @keyframes corner-in { to { opacity: 1; transform: translate(0, 0); } }
    /* Sweeping scan line */
    .scanline {
      position: absolute; left: 6%; right: 6%; height: 2px; top: 6%;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      animation: sweep 2.4s ease-in-out infinite, laser-pulse 1s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { top: 6%; opacity: 0; }
      12% { opacity: 1; }
      88% { opacity: 1; }
      100% { top: 94%; opacity: 0; }
    }
    /* Pulse the laser's glow so the line looks alive. */
    @keyframes laser-pulse {
      0%, 100% { box-shadow: 0 0 8px 1px color-mix(in srgb, var(--brand) 55%, transparent); }
      50% { box-shadow: 0 0 16px 3px color-mix(in srgb, var(--brand) 90%, transparent); }
    }
    /* Green flash when a code is detected */
    .stage.hit .frame .corner { border-color: var(--ok); animation: pop .35s ease-out; }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
    /* Expanding ring burst on a successful scan */
    .ripple {
      position: absolute; left: 50%; top: 50%; width: min(62%, 260px); aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(.4); border: 2px solid var(--ok); border-radius: 16px;
      opacity: 0; pointer-events: none;
    }
    .stage.hit .ripple { animation: ripple-out .55s ease-out; }
    @keyframes ripple-out {
      0% { opacity: .9; transform: translate(-50%, -50%) scale(.5); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); }
    }

    /* Placeholder shown before the camera starts */
    .placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted);
    }
    .placeholder svg { width: 46px; height: 46px; opacity: .7; animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: .55; }
      50% { transform: scale(1.08); opacity: .85; }
    }

    /* Primary control */
    .primary {
      border: 0; border-radius: 12px; padding: 13px 22px; font-weight: 650; font-size: 15px;
      background: var(--brand); color: var(--brand-ink); display: inline-flex; align-items: center; gap: 9px;
      transition: transform .18s ease-out, background-color .18s ease-out, box-shadow .18s ease-out;
    }
    .primary:hover:not(:disabled) { transform: translateY(-1px); background: var(--brand-2); box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 35%, transparent); }
    .primary:active:not(:disabled) { transform: translateY(0) scale(.98); }
    /* A gentle glow pulse invites the first tap; it stops once scanning. */
    .primary:not(.stop) { animation: invite 2.6s ease-in-out infinite; }
    @keyframes invite {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 45%, transparent); }
      50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--brand) 0%, transparent); }
    }
    .primary.stop { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
    .primary.stop:hover { background: var(--panel); }

    .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }

    /* Auto-start toggle */
    .setting { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--muted); cursor: pointer; user-select: none; }
    .setting input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch {
      width: 38px; height: 22px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line);
      position: relative; flex: none; transition: background-color .2s ease-out, border-color .2s ease-out;
    }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--muted); transition: transform .2s cubic-bezier(.2, .9, .3, 1.2), background-color .2s ease-out;
    }
    .setting input:checked + .switch { background: var(--brand); border-color: var(--brand); }
    .setting input:checked + .switch::after { transform: translateX(16px); background: #fff; }
    .setting input:focus-visible + .switch { outline: 2px solid var(--brand); outline-offset: 2px; }

    /* Result card */
    .result {
      width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 16px; animation: rise .25s ease-out;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .result .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .badge {
      font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand);
      animation: badge-pop .4s cubic-bezier(.2, 1.5, .4, 1) both;
    }
    @keyframes badge-pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
    .result .value {
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
      padding: 11px 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px;
      word-break: break-all; margin: 0 0 12px;
    }
    .result .actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .result .actions .chip { animation: rise .35s ease-out both; }
    .result .actions .chip:nth-child(1) { animation-delay: .08s; }
    .result .actions .chip:nth-child(2) { animation-delay: .16s; }
    .chip {
      border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px;
      padding: 9px 14px; font-size: 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 7px;
      text-decoration: none; color: var(--text);
      transition: transform .18s ease-out, background-color .18s ease-out, border-color .18s ease-out, color .18s;
    }
    .chip svg { width: 15px; height: 15px; }
    .chip:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--brand) 12%, transparent); border-color: var(--brand); color: var(--brand); }
    .chip:active { transform: translateY(0) scale(.97); }
    .chip.ok { color: var(--ok); border-color: var(--ok); }

    /* History */
    .history { width: 100%; max-width: 520px; }
    .history h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 4px 0 10px; }
    .hist-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 13px; border: 1px solid var(--line);
      background: var(--panel); border-radius: 12px; margin-bottom: 8px;
      opacity: 0; animation: rise .32s ease-out forwards;
      transition: transform .18s ease-out, border-color .18s ease-out, background-color .18s;
    }
    /* Stagger the first several rows so a fresh render cascades in. */
    .hist-item:nth-child(1) { animation-delay: .02s; }
    .hist-item:nth-child(2) { animation-delay: .07s; }
    .hist-item:nth-child(3) { animation-delay: .12s; }
    .hist-item:nth-child(4) { animation-delay: .17s; }
    .hist-item:nth-child(5) { animation-delay: .22s; }
    .hist-item:nth-child(n+6) { animation-delay: .26s; }
    .hist-item:hover { transform: translateX(3px); border-color: var(--brand); }
    .hist-item .h-badge {
      flex: none; font-size: 10.5px; font-weight: 650; letter-spacing: .03em; text-transform: uppercase;
      padding: 3px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
      min-width: 62px; text-align: center;
    }
    .hist-item .h-badge.url { background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand); border-color: transparent; }
    .hist-item .h-val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .hist-item .h-time { color: var(--muted); font-size: 12px; flex: none; }
    .hist-item .h-actions { display: flex; gap: 2px; flex: none; }
    .hist-item .h-icon { background: none; border: 0; color: var(--muted); padding: 6px; border-radius: 8px; display: grid; place-items: center; text-decoration: none; transition: transform .18s, color .18s, background-color .18s; }
    .hist-item .h-icon svg { width: 15px; height: 15px; }
    .hist-item .h-icon:hover { color: var(--brand); background: var(--panel-2); transform: scale(1.12); }
    .hist-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 16px 0; }
    .hist-head { display: flex; align-items: center; justify-content: space-between; }
    .link-btn { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px 6px; border-radius: 8px; transition: color .18s, background-color .18s; }
    .link-btn:hover { color: var(--danger); background: var(--panel-2); }

    /* Error / permission message */
    .notice {
      width: 100%; max-width: 520px; border-radius: 12px; padding: 13px 15px; font-size: 14px;
      border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--line));
      background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--text);
    }
    .notice b { color: var(--danger); }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 550; opacity: 0; pointer-events: none;
      transition: opacity .25s ease-out, transform .3s cubic-bezier(.2, 1.4, .3, 1); z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 14px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
    </span>
    <h1>Code Scanner</h1>
    <button class="icon-btn" id="switchBtn" title="Switch camera" disabled aria-label="Switch camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><path d="m16 16-3 3 3 3"/><path d="m8 8 3-3-3-3"/></svg>
    </button>
    <button class="icon-btn" id="torchBtn" title="Toggle flashlight" disabled aria-label="Toggle flashlight">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6l-1 7h3l-7 13v-9H8z"/></svg>
    </button>
  </header>

  <main>
    <div class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <div class="reticle" id="reticle" hidden>
        <div class="mask"></div>
        <div class="frame">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
          <div class="scanline"></div>
        </div>
        <div class="ripple"></div>
      </div>
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Point your camera at a QR code or barcode.<br/>Your camera stays on this device.</span>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="toggleBtn" aria-live="polite">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Start scanning
      </button>

      <label class="setting" title="Turn the camera on as soon as the page opens">
        <input type="checkbox" id="autoStart" />
        <span class="switch" aria-hidden="true"></span>
        <span>Start camera automatically</span>
      </label>
    </div>

    <div class="notice" id="notice" hidden></div>

    <div class="result" id="result" hidden></div>

    <section class="history">
      <div class="hist-head">
        <h2>Scan history</h2>
        <button class="link-btn" id="clearBtn" hidden>Clear</button>
      </div>
      <div id="histList"></div>
    </section>
  </main>

  <footer>Everything runs locally in your browser. Nothing is uploaded.</footer>
  <div class="toast" id="toast"></div>

  <script src="vendor/zxing.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
